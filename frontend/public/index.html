<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a8c4a" />

    <link rel="icon" href="/images/icon.png" />

    <!-- Hero image preload: mobile only uses the small image, desktop uses the original image -->
    <link
      rel="preload"
      as="image"
      href="/images/Capture-mobile.webp"
      type="image/webp"
      media="(max-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/Capture.webp"
      type="image/webp"
      media="(min-width: 769px)"
      fetchpriority="high"
    />

    <title>Napaty</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
